# An example configuration: a few options, a prefix of C-a, split and pane keys, and a colored
# status line. Everything here is ordinary tmux-style config.

# ── General ───────────────────────────────────────────────────────────────────
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000

# ── Prefix: Ctrl-a ────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Keys ──────────────────────────────────────────────────────────────────────
bind r source-file ~/.imux.conf \; display "Config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Colors ────────────────────────────────────────────────────────────────────
bg="#000000"
bg2="#1e1e2e"
surface="#313244"
overlay="#45475a"
muted="#585b70"
text="#cdd6f4"
subtext="#a6adc8"
blue="#89b4fa"
yellow="#f9e2af"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=${muted}"
set -g pane-active-border-style "fg=${blue}"

# ── Status line ───────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=${bg},fg=${subtext}"

set -g status-left-length 40
set -g status-left "#[bg=${blue},fg=${bg},bold] 󰌪 #S #[bg=${bg},fg=${blue}]"

set -g status-right-length 80
set -g status-right "#[bg=${muted},fg=${bg}] #h #[bg=${surface},fg=${subtext}] %I:%M %p #[bg=${overlay},fg=${text}] %m/%d/%Y #[bg=${overlay},fg=${bg2}]"

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-format "#[fg=${bg},bg=${bg}]#[fg=${subtext},bg=${bg2}] #I  #W #[fg=${bg2},bg=${bg}]"
set -g window-status-current-format "#[fg=${bg},bg=${bg}]#[fg=${bg},bg=${blue},bold] #I  #W #[fg=${blue},bg=${bg}]"
set -g automatic-rename on

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "bg=${yellow},fg=${bg},bold"
set -g message-command-style "bg=${surface},fg=${text}"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -g mode-keys vi
set -g mode-style "bg=${blue},fg=${bg}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel
